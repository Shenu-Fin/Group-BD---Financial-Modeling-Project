# Money-app theme for the DIVMA dashboard: soft grey ground, white tiles, violet ink.
[theme]
base = "light"
primaryColor = "#5B4BFF"
backgroundColor = "#F4F4F6"
secondaryBackgroundColor = "#F1F1F4"
textColor = "#0B0B0F"
borderColor = "#E4E4EA"
showWidgetBorder = false
baseRadius = "12px"
buttonRadius = "full"
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
headingFontWeights = [800, 800, 700, 700, 700, 700]
linkColor = "#5B4BFF"
greenColor = "#15803D"
redColor = "#DC2626"
dataframeHeaderBackgroundColor = "#FFFFFF"
dataframeBorderColor = "#ECECF0"
chartCategoricalColors = ["#5B4BFF", "#A9A9B8", "#22A3FF", "#F5A524"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F6"
textColor = "#0B0B0F"
primaryColor = "#5B4BFF"
borderColor = "#ECECF0"

[client]
toolbarMode = "minimal"
